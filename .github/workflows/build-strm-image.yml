name: Build STRM Docker Image

# 构建 STRM 定制版 Docker 镜像并推送到 GitHub 容器仓库 (GHCR)。
# 自动构建已停用（GitHub 账户额度超额）。
# 触发方式：仅 Actions 页面手动运行 (workflow_dispatch)。
# 镜像地址：ghcr.io/<你的用户名>/audiobookshelf-strm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（如 2.35.1 或 latest）'
        required: true
        default: 'latest'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/audiobookshelf-strm

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算镜像 tag
        id: tags
        run: |
          V="${{ inputs.tag }}"
          echo "list=${IMAGE}:${V},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "将构建: ${IMAGE}:${V} 和 ${IMAGE}:latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
