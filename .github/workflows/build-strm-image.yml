name: Build STRM Docker Image

# 构建 STRM 定制版 Docker 镜像并推送到 GitHub 容器仓库 (GHCR)。
# 触发方式：auto-update-strm.yml 检测到未构建的版本时自动触发，也可在 Actions 页面手动运行。
# 构建成功后打 built-<tag> 标记，供 auto-update-strm.yml 判断是否需要（重新）构建。
# 镜像地址：ghcr.io/<你的用户名>/audiobookshelf-strm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（如 2.35.1 或 latest）'
        required: true
        default: 'latest'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/audiobookshelf-strm

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算镜像 tag
        id: tags
        run: |
          V="${{ inputs.tag }}"
          echo "list=${IMAGE}:${V},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "将构建: ${IMAGE}:${V} 和 ${IMAGE}:latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建成功才打标记，失败时 auto-update-strm.yml 次日重新触发
      - name: 打构建标记 tag
        if: inputs.tag != 'latest'
        run: |
          git config user.name "strm-auto-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "built-${{ inputs.tag }}"
          git push origin "refs/tags/built-${{ inputs.tag }}"
