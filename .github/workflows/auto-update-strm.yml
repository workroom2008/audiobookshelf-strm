name: Auto Update STRM from Upstream

# 定时轮询官方 advplyr/audiobookshelf 的最新 release，
# 自动把 strm 定制改动 rebase 到最新版本并打 tag。
# 注意：自动构建已停用（GitHub 账户额度超额），本流程不再触发镜像构建。
# - 无新版本：什么都不做。
# - 有新版本且无冲突：自动更新 strm 分支 + 打 strm-vX.Y.Z tag（不构建镜像）。
# - 有冲突：中止、不破坏代码，并自动开 issue 提醒你人工 rebase 一次。

on:
  schedule:
    - cron: '0 5 * * *'   # 每天 UTC 02:00 检查一次（北京时间 10:00）
  workflow_dispatch:        # 也支持在 Actions 页手动触发

concurrency:
  group: auto-update-strm
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出 strm 分支（含完整历史）
        uses: actions/checkout@v4
        with:
          ref: strm
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name "strm-auto-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 添加 upstream 并拉取官方 tags
        run: |
          git remote add upstream https://github.com/advplyr/audiobookshelf.git || true
          git fetch upstream --tags --force --quiet

      - name: 获取官方最新发布版本
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          L=$(gh api repos/advplyr/audiobookshelf/releases/latest --jq .tag_name)
          echo "官方最新 release: $L"
          echo "tag=$L" >> "$GITHUB_OUTPUT"

      - name: rebase 定制改动到最新版本
        id: rebase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          L="${{ steps.latest.outputs.tag }}"     # 例如 v2.36.0
          STRMTAG="strm-${L}"                     # strm-v2.36.0

          # 该版本已打过 tag -> 跳过
          if git ls-remote --exit-code --tags origin "refs/tags/$STRMTAG" >/dev/null 2>&1; then
            echo "✅ $STRMTAG 已存在，已是最新，无需更新"
            exit 0
          fi

          # 官方 tag 必须存在
          if ! git rev-parse -q --verify "refs/tags/$L" >/dev/null; then
            echo "Official tag $L was not found; skipping"
            exit 0
          fi

          git checkout strm
          BEFORE_REBASE=$(git rev-parse HEAD)
          if git rebase "$L"; then
            # 恢复我们自己的 workflows（上游可能新增/修改 workflow 文件，GITHUB_TOKEN 无权推送会被拒）
            # 整目录删除清掉上游 workflow，再按【显式白名单】恢复自有文件。
            # 不用 "git checkout $BEFORE_REBASE -- .github/workflows/"：那是以上次状态为准，
            # 一旦历史里混入过上游 workflow 就会被永久继承。白名单以仓库自身为准，与历史无关。
            rm -rf .github/workflows
            mkdir -p .github/workflows
            KEEP="auto-update-strm.yml build-strm-image.yml"
            for f in $KEEP; do
              if git cat-file -e "$BEFORE_REBASE:.github/workflows/$f" 2>/dev/null; then
                git show "$BEFORE_REBASE:.github/workflows/$f" > ".github/workflows/$f"
              else
                echo "⚠️ 白名单文件在上次提交中缺失: $f"
              fi
            done
            # 安全闸：自有 workflow 必须齐全，否则宁可中止也不推（避免把 fork 的 CI 搞没）
            MISSING=""
            for f in $KEEP; do
              [ -s ".github/workflows/$f" ] || MISSING="$MISSING $f"
            done
            if [ -n "$MISSING" ]; then
              echo "❌ 自有 workflow 缺失:$MISSING —— 中止同步，strm 分支未改动"
              git rebase --abort || true
              exit 1
            fi
            # 意外混入的非白名单文件直接清掉（双保险）
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
              ! -name 'auto-update-strm.yml' ! -name 'build-strm-image.yml' -delete
            git add -A .github/workflows/
            git diff --cached --quiet || git commit -m "chore: keep our workflows"
            git tag "$STRMTAG"
            git push origin strm --force-with-lease
            git push origin "$STRMTAG"
            echo "🎉 已把定制改动更新到 $L 并打 tag $STRMTAG（未构建镜像）"
          else
            git rebase --abort || true
            echo "❌ rebase 到 $L 出现冲突，已中止，未改动 strm"
            # 同版本若已有未关闭的 issue 则不重复创建
            EXIST=$(gh issue list --state open --search "\"$L\" in:title" --json number --jq 'length')
            if [ "$EXIST" = "0" ]; then
              BODY=$(printf '自动把 strm 定制改动 rebase 到官方 `%s` 时发生**冲突**，已自动中止（strm 分支未被改动，镜像不受影响）。\n\n请在本地解决一次冲突：\n```bash\ncd abs-strm\ngit fetch upstream --tags\ngit checkout strm\ngit rebase %s\n# 手动解决冲突后：\ngit add <冲突文件>\ngit rebase --continue\ngit tag %s\ngit push origin strm --force-with-lease\ngit push origin %s\n```\n注意：自动构建已停用，推送后不会自动构建镜像，需要时手动跑 `build-strm-image.yml`。' "$L" "$L" "$STRMTAG" "$STRMTAG")
              gh issue create --title "⚠️ 自动更新冲突：官方 $L 需人工 rebase" --body "$BODY" || echo "⚠️ 开 issue 失败（仓库可能已禁用 Issues），请人工 rebase"
            fi
          fi
